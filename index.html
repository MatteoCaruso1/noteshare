<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
    
    <!-- Preconnect to font origins for faster FCP -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Preload critical Inter font for faster LCP -->
    <link rel="preload" href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7W0Q5nw.woff2" as="font" type="font/woff2" crossorigin />
    
    <!-- Non-render-blocking font loading with display=swap for all -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400;1,9..40,500&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400;1,9..40,500&family=JetBrains+Mono:wght@400;500&display=swap" />
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&display=swap" />
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" />
    </noscript>
    
    <title>Noteshare — Music Practice Journal for Musicians</title>
    <meta name="description" content="Noteshare is the music practice journal that helps musicians capture ideas, track progress, and share with trusted peers. 10× easier than voice memos. Try free." />
    <meta name="author" content="Noteshare" />
    <meta name="keywords" content="Noteshare, Noteshare music, music practice app, practice journal, music practice tracker, musician practice tool, practice log, music notes app, musician journal" />
    <link rel="canonical" href="https://jazz-scene-alive.lovable.app" />

    <meta property="og:title" content="Noteshare — Music Practice Journal" />
    <meta property="og:description" content="Capture practice ideas, track your progress, and share with your inner circle. The practice tool built for musicians." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jazz-scene-alive.lovable.app" />
    <meta property="og:image" content="https://jazz-scene-alive.lovable.app/pwa-icon-512.png" />
    <meta property="og:site_name" content="Noteshare" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@noteshare" />
    <meta name="twitter:title" content="Noteshare — Music Practice Journal" />
    <meta name="twitter:description" content="Capture practice ideas, track your progress, and share with your inner circle. Built for musicians." />
    <meta name="twitter:image" content="https://jazz-scene-alive.lovable.app/pwa-icon-512.png" />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Noteshare",
      "url": "https://noteshare.app",
      "description": "Practice tracking and progress analytics platform for musicians.",
      "sameAs": ["https://noteshare.app"]
    }
    </script>

    <!-- Structured Data: WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Noteshare",
      "url": "https://noteshare.app",
      "applicationCategory": "MusicApplication",
      "operatingSystem": "Web, iOS",
      "description": "Track practice sessions, capture ideas, reflect with notes, and analyze progress over time. The practice journal built for musicians.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "creator": {
        "@type": "Organization",
        "name": "Noteshare"
      }
    }
    </script>

    <!-- Structured Data: SoftwareApplication (PWA) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Noteshare",
      "applicationCategory": "MusicApplication",
      "operatingSystem": "Web, iOS",
      "description": "A music practice journal that helps musicians capture ideas, track progress, and share with trusted peers. 10× easier than voice memos.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <!-- PWA Theme Color -->
    <meta name="theme-color" content="#0a0a0f" />
    
    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Noteshare" />
    
    <!-- Favicon and Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- iOS Splash Screens - using theme color for consistency -->
    <link rel="apple-touch-startup-image" href="/pwa-icon-512.png" />
  </head>

  <body class="dark">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
